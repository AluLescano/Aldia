<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <!-- Browser/status bar color. Meta tags cannot read CSS variables: keep it equal to
         --bg-screen of the theme above (light #f6f0e8, dark #0a0f0c). The theme toggle
         will have to update it from JS. -->
    <meta name="theme-color" content="#0a0f0c" />
    <meta name="color-scheme" content="dark light" />
    <title>Aldia — Subscription & Expense Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
