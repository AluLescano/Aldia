name: Feature or idea
description: Something new, or a better way to do something
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard, missing or annoying today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Version
      options:
        - v1 (MVP)
        - v1.x
        - v2+
        - Not sure
